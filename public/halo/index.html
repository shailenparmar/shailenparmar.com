<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halo</title>
<style>
  :root { --bg:#fafaf7; --fg:#1b1b1a; --line:#dcdcd5; --accent:#1a56db; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141413; --fg:#ecece6; --line:#2e2e2b; --accent:#7aa2ff; --card:#1b1b1a; } }
  * { box-sizing:border-box }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:24px 16px; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif }
  h1 { font-size:28px; margin:0; letter-spacing:-.01em }
  a.btn { display:inline-block; font:15px ui-monospace,SFMono-Regular,Menlo,monospace; padding:11px 28px; background:var(--accent); color:#fff; border-radius:4px; text-decoration:none }
  a.btn:hover { filter:brightness(1.1) }
  svg#ctl { display:block; width:100%; max-width:460px }
  #ctl .shell { fill:color-mix(in srgb,var(--fg) 7%,var(--card)); stroke:var(--line); stroke-width:1.5 }
  #ctl .well { fill:color-mix(in srgb,var(--fg) 14%,var(--card)); stroke:var(--line) }
  #ctl .cap { fill:color-mix(in srgb,var(--fg) 30%,var(--card)) } #ctl .cap2 { fill:color-mix(in srgb,var(--fg) 18%,var(--card)) }
  #ctl .ring { fill:none; stroke:var(--accent); stroke-width:3; opacity:0 } #ctl .ring.on { opacity:1 }
  #ctl .key { fill:color-mix(in srgb,var(--fg) 20%,var(--card)); transition:fill .05s } #ctl .on.key, #ctl g.on .key { fill:var(--accent) }
  #ctl .fill { fill:var(--accent) }
  #ctl .t { font:700 12px ui-monospace,Menlo,monospace; text-anchor:middle; fill:var(--bg); pointer-events:none }
  #ctl { opacity:.45; transition:opacity .2s } #ctl.live { opacity:1 }
</style>
</head>
<body>
  <h1>Halo</h1>
  <svg id="ctl" viewBox="0 0 460 230" role="img" aria-label="Controller">
    <rect x="66" y="8" width="84" height="18" rx="9" class="shell"/><rect id="zl-fill" x="66" y="8" width="84" height="18" rx="9" class="fill" style="clip-path:inset(0 100% 0 0)"/>
    <rect x="310" y="8" width="84" height="18" rx="9" class="shell"/><rect id="zr-fill" x="310" y="8" width="84" height="18" rx="9" class="fill" style="clip-path:inset(0 100% 0 0)"/>
    <rect id="b4" x="60" y="28" width="96" height="16" rx="8" class="key"/>
    <rect id="b5" x="304" y="28" width="96" height="16" rx="8" class="key"/>
    <path class="shell" d="M74 66C94 46 152 44 230 44s136 2 156 22c32 30 52 134 34 184-10 28-52 28-68-2-14-26-30-34-56-34H164c-26 0-42 8-56 34-16 30-58 30-68 2-18-50 2-154 34-184z" transform="translate(0 -20) scale(1 .9)"/>
    <g transform="translate(112 86)"><circle r="27" class="well"/><g id="stickL"><circle r="20" class="cap"/><circle r="11" class="cap2"/></g><circle id="b10" r="20" class="ring"/></g>
    <g transform="translate(300 148)"><circle r="27" class="well"/><g id="stickR"><circle r="20" class="cap"/><circle r="11" class="cap2"/></g><circle id="b11" r="20" class="ring"/></g>
    <g transform="translate(166 146)">
      <rect id="b12" x="-8" y="-30" width="16" height="22" rx="3" class="key"/><rect id="b13" x="-8" y="8" width="16" height="22" rx="3" class="key"/>
      <rect id="b14" x="-30" y="-8" width="22" height="16" rx="3" class="key"/><rect id="b15" x="8" y="-8" width="22" height="16" rx="3" class="key"/>
    </g>
    <g transform="translate(350 88)">
      <circle id="b3" cx="0" cy="-26" r="14" class="key"/><text x="0" y="-21" class="t">X</text>
      <circle id="b1" cx="26" cy="0" r="14" class="key"/><text x="26" y="5" class="t">A</text>
      <circle id="b0" cx="0" cy="26" r="14" class="key"/><text x="0" y="31" class="t">B</text>
      <circle id="b2" cx="-26" cy="0" r="14" class="key"/><text x="-26" y="5" class="t">Y</text>
    </g>
    <rect id="b8" x="190" y="60" width="22" height="8" rx="4" class="key"/>
    <g id="b9"><rect x="250" y="60" width="22" height="8" rx="4" class="key"/><rect x="257" y="55" width="8" height="18" rx="4" class="key"/></g>
    <circle id="b16" cx="246" cy="104" r="8" class="key"/><rect x="202" y="98" width="14" height="12" rx="3" class="key" opacity=".5"/>
  </svg>
  <a class="btn" href="https://halo-web.otherness-bugs.workers.dev/" target="_blank" rel="noopener">Play</a>

<script>
const $ = (id) => document.getElementById(id), R = 13;
function stick(el, x, y) {
  const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; }
  el.setAttribute("transform", `translate(${(x * R).toFixed(2)} ${(y * R).toFixed(2)})`);
}
function poll() {
  const p = (navigator.getGamepads ? Array.from(navigator.getGamepads()) : []).find(Boolean);
  const svg = $("ctl");
  svg.classList.toggle("live", !!p);
  if (p) {
    for (let i = 0; i <= 16; i++) { const el = $("b" + i); if (el) el.classList.toggle("on", !!(p.buttons[i] && p.buttons[i].pressed)); }
    stick($("stickL"), p.axes[0] || 0, p.axes[1] || 0); stick($("stickR"), p.axes[2] || 0, p.axes[3] || 0);
    const zl = (p.buttons[6] && p.buttons[6].value) || 0, zr = (p.buttons[7] && p.buttons[7].value) || 0;
    $("zl-fill").style.clipPath = `inset(0 ${(100 - zl * 100).toFixed(0)}% 0 0)`;
    $("zr-fill").style.clipPath = `inset(0 0 0 ${(100 - zr * 100).toFixed(0)}%)`;
  }
  requestAnimationFrame(poll);
}
poll();
</script>
</body>
</html>
